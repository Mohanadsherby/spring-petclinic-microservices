apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers-service
  labels:
    app: customers-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: customers-service
  template:
    metadata:
      labels:
        app: customers-service
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: customers-service
          image: {{ .Values.imageRegistry }}/{{ .Values.customersService.image }}:{{ .Values.customersService.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: petclinic-config
          ports:
            - containerPort: {{ .Values.customersService.port }}
          startupProbe:
            httpGet:
              path: {{ .Values.customersService.healthPath }}
              port: {{ .Values.customersService.port }}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: {{ .Values.customersService.healthPath }}
              port: {{ .Values.customersService.port }}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.customersService.healthPath }}
              port: {{ .Values.customersService.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: customers-service
  labels:
    app: customers-service
spec:
  type: ClusterIP
  selector:
    app: customers-service
  ports:
    - port: {{ .Values.customersService.port }}
      targetPort: {{ .Values.customersService.port }}
