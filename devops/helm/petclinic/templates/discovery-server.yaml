apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  labels:
    app: discovery-server
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: discovery-server
          image: {{ .Values.imageRegistry }}/{{ .Values.discoveryServer.image }}:{{ .Values.discoveryServer.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: petclinic-config
          ports:
            - containerPort: {{ .Values.discoveryServer.port }}
          startupProbe:
            httpGet:
              path: {{ .Values.discoveryServer.healthPath }}
              port: {{ .Values.discoveryServer.port }}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: {{ .Values.discoveryServer.healthPath }}
              port: {{ .Values.discoveryServer.port }}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.discoveryServer.healthPath }}
              port: {{ .Values.discoveryServer.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  labels:
    app: discovery-server
spec:
  type: ClusterIP
  selector:
    app: discovery-server
  ports:
    - port: {{ .Values.discoveryServer.port }}
      targetPort: {{ .Values.discoveryServer.port }}
