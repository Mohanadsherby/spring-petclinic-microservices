# ArgoCD Application: watches git and deploys the api-gateway release.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mohanadsherby/spring-petclinic-microservices.git
    targetRevision: main
    path: devops/helm/petclinic
    helm:
      valueFiles:
        - values/api-gateway.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
